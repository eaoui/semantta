<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading...</title>
  <script>
    (function () {
      try {
        const theme = localStorage.getItem('theme') || 'system'
        if (
          theme === 'dark' ||
          (
            theme === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          )
        ) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) { }
    })()
  </script>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family:
        ui-sans-serif,
        system-ui,
        sans-serif,
        "Apple Color Emoji",
        "Segoe UI Emoji",
        "Segoe UI Symbol",
        "Noto Color Emoji";
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      margin-bottom: 1rem;
      color: #4a5565;
      animation: spin 1s linear infinite;
    }

    .loading-title {
      margin: 0;
      color: #364153;
      font-size: 1.125rem;
      font-weight: 600;
      line-height: 1.75rem;
    }

    .loading-message {
      margin: 0.25rem 0 0;
      color: #6a7282;
      font-size: 0.875rem;
      line-height: 1.25rem;
    }

    html.dark,
    html.dark body {
      background: #111827;
    }

    html.dark .loading-overlay {
      background: #101828;
    }

    html.dark .loading-spinner {
      color: #d1d5dc;
    }

    html.dark .loading-title {
      color: #e5e7eb;
    }

    html.dark .loading-message {
      color: #99a1af;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-spinner {
        animation-duration: 2s;
      }
    }
  </style>
</head>

<body>
  <div class="loading-overlay" role="status" aria-live="polite">
    <div class="loading-content">
      <svg class="loading-spinner" viewBox="0 0 256 256" aria-hidden="true">
        <rect width="48" height="48" fill="none" />
        <path d="M168,40a97,97,0,0,1,56,88,96,96,0,0,1-192,0A97,97,0,0,1,88,40" fill="none" stroke="currentColor"
          stroke-linecap="round" stroke-linejoin="round" stroke-width="16" />
      </svg>
      <p class="loading-title">Loading</p>
      <p class="loading-message">Preparing the interface…</p>
    </div>
  </div>
</body>

</html>
