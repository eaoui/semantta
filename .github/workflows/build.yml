name: Build Semantta

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'CHANGELOG*'

    tags:
      - 'v*.*.*'

  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'CHANGELOG*'

permissions:
  contents: read

concurrency:
  group: semantta-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.ci-cache/electron-builder
      electron_config_cache: ${{ github.workspace }}/.ci-cache/electron

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            electron_target: linux
            expected:
              - AppImage
              - deb

          - name: windows-x64
            os: windows-2025
            electron_target: win
            expected:
              - exe

          - name: macos-arm64
            os: macos-15
            electron_target: mac
            expected:
              - dmg
              - zip

          - name: macos-x64
            os: macos-15-intel
            electron_target: mac
            expected:
              - dmg
              - zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Electron build dependencies
        uses: actions/cache@v6
        with:
          path: |
            .ci-cache/electron
            .ci-cache/electron-builder
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-electron-

      - name: Determine application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer tag: $GITHUB_REF_NAME"
            exit 1
          fi

          echo "SEMANTTA_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Apply release version
        if: env.SEMANTTA_VERSION != ''
        working-directory: frontend
        shell: bash
        run: |
          npm version "$SEMANTTA_VERSION" \
            --no-git-tag-version \
            --allow-same-version \
            --ignore-scripts

      - name: Show application version
        working-directory: frontend
        shell: bash
        run: |
          node -p "require('./package.json').version"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-build.txt

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libopenjp2-tools \
            xvfb

      - name: Install Python build dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache bundled runtime
        uses: actions/cache@v6
        with:
          path: frontend/runtime
          key: ${{ matrix.name }}-runtime-fuseki-6.2.0-java21-${{ hashFiles('frontend/scripts/prepare_runtime.py') }}
          restore-keys: |
            ${{ matrix.name }}-runtime-fuseki-6.2.0-java21-

      - name: Prepare runtime
        working-directory: frontend
        run: npm run electron:prepare-runtime

      - name: Build backend
        working-directory: frontend
        run: npm run electron:build-backend

      - name: Verify runtime components
        run: python scripts/verify_runtime.py

      - name: Generate frontend
        working-directory: frontend
        run: npm run electron:generate

      - name: Build distributables
        working-directory: frontend
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder

      - name: Smoke-test packaged application
        working-directory: frontend
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/semantta-data
          APPDATA: ${{ runner.temp }}/semantta-appdata
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a node ../scripts/smoke_test.mjs
          else
            node ../scripts/smoke_test.mjs
          fi
          
      - name: Verify installers on clean environment
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        working-directory: frontend
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/semantta-installer-data
          APPDATA: ${{ runner.temp }}/semantta-installer-appdata
          HOME: ${{ runner.temp }}/semantta-installer-home
        run: python ../scripts/verify_installers.py

      - name: Verify generated artifacts
        working-directory: frontend
        shell: bash
        env:
          EXPECTED_ARTIFACTS: ${{ toJson(matrix.expected) }}
          PLATFORM_TARGET: ${{ matrix.electron_target }}
        run: |
          python ../scripts/verify_build.py

      - name: List generated artifacts
        working-directory: frontend
        shell: bash
        run: |
          echo "Generated artifacts:"
          find out -maxdepth 2 -type f -print

      - name: Upload build artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: semantta-${{ matrix.name }}-${{ env.SEMANTTA_VERSION || 'dev' }}
          path: frontend/out/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: semantta-*
          path: release-assets
          merge-multiple: true

      - name: Collect distributable files
        shell: bash
        run: |
          mkdir -p release-files

          find release-assets -type f \
            \( \
              -name '*.AppImage' -o \
              -name '*.deb' -o \
              -name '*.exe' -o \
              -name '*.dmg' -o \
              -name '*.zip' \
            \) \
            -exec cp {} release-files/ \;

          count=$(find release-files -maxdepth 1 -type f | wc -l)

          if [ "$count" -ne 7 ]; then
            echo "Expected 7 distributable files, found $count"
            find release-files -maxdepth 1 -type f -print
            exit 1
          fi

          echo "Distributable files:"
          find release-files -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Generate release checksums
        shell: bash
        run: |
          (
            cd release-files
            sha256sum * | sort
          ) > SHA256SUMS

          echo "SHA256SUMS:"
          cat SHA256SUMS

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              release-files/* \
              SHA256SUMS \
              --clobber
          else
            gh release create "$TAG" \
              release-files/* \
              --verify-tag \
              --generate-notes \
              --title "Semantta $VERSION"

            gh release upload "$TAG" \
              SHA256SUMS \
              --clobber
          fi

      - name: Verify published GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            > release.json

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("release.json").read_text())

          expected_tag = "${{ github.ref_name }}"
          tag = data["tag_name"]
          draft = data["draft"]
          prerelease = data["prerelease"]
          assets = data["assets"]

          expected = sorted(
              [p.name for p in Path("release-files").iterdir() if p.is_file()]
              + ["SHA256SUMS"]
          )

          actual = sorted(asset["name"] for asset in assets)

          if tag != expected_tag:
              raise SystemExit(
                  f"Release tag mismatch: expected {expected_tag}, got {tag}"
              )

          if draft:
              raise SystemExit("Release is unexpectedly still a draft.")

          if prerelease:
              raise SystemExit("Release is unexpectedly marked as a prerelease.")

          if actual != expected:
              print("Expected assets:")
              for name in expected:
                  print(f"  {name}")

              print("Actual assets:")
              for name in actual:
                  print(f"  {name}")

              raise SystemExit(
                  "Published release assets do not match expected assets."
              )

          print(f"Verified {len(actual)} release assets.")
          PY

      - name: Verify published asset digests
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            --jq '
              .assets[]
              | select(.name != "SHA256SUMS")
              | "\(.name)\t\(.digest)"
            ' \
            | sort > github-digests.txt

          (
            cd release-files
            sha256sum * |
              awk '{print $2 "\tsha256:" $1}' |
              sort
          ) > local-digests.txt

          echo "GitHub digests:"
          cat github-digests.txt

          echo
          echo "Local digests:"
          cat local-digests.txt

          diff -u local-digests.txt github-digests.txt