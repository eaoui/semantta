name: Build Semantta

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            electron_target: linux
            expected:
              - AppImage
              - deb

          - name: windows-x64
            os: windows-2025
            electron_target: win
            expected:
              - exe

          - name: macos-arm64
            os: macos-15
            electron_target: mac
            expected:
              - dmg
              - zip

          - name: macos-x64
            os: macos-15-intel
            electron_target: mac
            expected:
              - dmg
              - zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-build.txt

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libopenjp2-tools

      - name: Install Python build dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Prepare runtime
        working-directory: frontend
        run: npm run electron:prepare-runtime

      - name: Build backend
        working-directory: frontend
        run: npm run electron:build-backend

      - name: Verify runtime components
        run: python scripts/verify_runtime.py

      - name: Build frontend and package application
        working-directory: frontend
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run electron:generate
          electron-builder

      - name: Verify generated artifacts
        working-directory: frontend
        shell: bash
        env:
          EXPECTED_ARTIFACTS: ${{ toJson(matrix.expected) }}
          PLATFORM_TARGET: ${{ matrix.electron_target }}
        run: |
          python ../scripts/verify_build.py

      - name: List generated artifacts
        working-directory: frontend
        shell: bash
        run: |
          echo "Generated artifacts:"
          find out -maxdepth 2 -type f -print

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: semantta-${{ matrix.name }}
          path: frontend/out/**
          if-no-files-found: error
          retention-days: 14