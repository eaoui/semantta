name: Build Semantta

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            electron_target: linux
            expected:
              - AppImage
              - deb

          - name: windows-x64
            os: windows-2025
            electron_target: win
            expected:
              - exe

          - name: macos-arm64
            os: macos-15
            electron_target: mac
            expected:
              - dmg
              - zip

          - name: macos-x64
            os: macos-15-intel
            electron_target: mac
            expected:
              - dmg
              - zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Determine application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer tag: $GITHUB_REF_NAME"
            exit 1
          fi

          echo "SEMANTTA_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Apply release version
        if: env.SEMANTTA_VERSION != ''
        working-directory: frontend
        shell: bash
        run: |
          npm version "$SEMANTTA_VERSION" \
            --no-git-tag-version \
            --allow-same-version \
            --ignore-scripts

      - name: Show application version
        working-directory: frontend
        shell: bash
        run: |
          node -p "require('./package.json').version"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-build.txt

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libopenjp2-tools \
            xvfb

      - name: Install Python build dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Prepare runtime
        working-directory: frontend
        run: npm run electron:prepare-runtime

      - name: Build backend
        working-directory: frontend
        run: npm run electron:build-backend

      - name: Verify runtime components
        run: python scripts/verify_runtime.py

      - name: Generate frontend
        working-directory: frontend
        run: npm run electron:generate

      - name: Build unpacked Electron application
        working-directory: frontend
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --dir -c.directories.output=out-smoke

      - name: Smoke-test packaged application
        working-directory: frontend
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/semantta-data
          APPDATA: ${{ runner.temp }}/semantta-appdata
          SMOKE_TEST_OUTPUT_DIR: out-smoke
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a node ../scripts/smoke_test.mjs
          else
            node ../scripts/smoke_test.mjs
          fi

      - name: Build distributables
        working-directory: frontend
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder

      - name: Verify generated artifacts
        working-directory: frontend
        shell: bash
        env:
          EXPECTED_ARTIFACTS: ${{ toJson(matrix.expected) }}
          PLATFORM_TARGET: ${{ matrix.electron_target }}
        run: |
          python ../scripts/verify_build.py

      - name: List generated artifacts
        working-directory: frontend
        shell: bash
        run: |
          echo "Generated artifacts:"
          find out -maxdepth 2 -type f -print

      - name: Upload build artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: semantta-${{ matrix.name }}-${{ env.SEMANTTA_VERSION || 'dev' }}
          path: frontend/out/*
          if-no-files-found: error
          retention-days: 14
